name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      run_expensive: ${{ steps.filter.outputs.run_expensive }}
    steps:
      - name: Check out MyCore
        uses: actions/checkout@v7.0.0

      - name: Detect changes requiring full CI
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            run_expensive:
              - '**'
              - '!**/*.md'

  format-check:
    name: C++ format check
    needs: changes
    if: needs.changes.outputs.run_expensive == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out MyCore
        uses: actions/checkout@v7.0.0

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format

      - name: Verify clang-format
        shell: bash
        run: |
          git ls-files -z \
            '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hh' '*.hpp' '*.hxx' \
            | xargs -0 -r clang-format --dry-run --Werror --style=file

  build-and-test:
    name: Build and test (${{ matrix.platform }})
    needs: changes
    if: needs.changes.outputs.run_expensive == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            preset: linux-clang-debug
          - platform: macOS
            runner: macos-latest
            preset: macos-clang-debug
          - platform: Windows
            runner: windows-2022
            preset: windows-msvc-debug
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg/archives
      VCPKG_MAX_CONCURRENCY: 4

    steps:
      - name: Check out MyCore
        uses: actions/checkout@v7.0.0

      - name: Prepare vcpkg binary cache
        run: cmake -E make_directory "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}"

      - name: Restore vcpkg binary cache
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-

      - name: Check out pinned vcpkg
        uses: actions/checkout@v7.0.0
        with:
          repository: microsoft/vcpkg
          ref: ec62869cdd9f80413abb5e4c1d8b68688df932f4
          path: vcpkg

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Install Linux dependency tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxft-dev libxext-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxrandr-dev \
            libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libibus-1.0-dev \
            clang-tidy

      - name: Install macOS dependency tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install pkg-config

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Run clang-tidy
        if: matrix.platform == 'Linux'
        shell: bash
        run: |
          run-clang-tidy \
            -p build/${{ matrix.preset }} \
            -warnings-as-errors='*' \
            -quiet

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package Dots client
        run: cmake --build --preset ${{ matrix.preset }} --target dots_client_package

      - name: Upload Dots client package
        uses: actions/upload-artifact@v7
        with:
          name: dots-client-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/packages/dots-client-*
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ matrix.platform }}-attempt-${{ github.run_attempt }}
          path: |
            build/${{ matrix.preset }}/vcpkg-manifest-install.log
            build/${{ matrix.preset }}/CMakeFiles/CMakeConfigureLog.yaml
            build/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7

  ci-gate:
    name: CI gate
    needs: [changes, build-and-test, format-check]
    if: always()
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed or were intentionally skipped
        run: |
          test "${{ needs.changes.result }}" = "success"
          if [ "${{ needs.changes.outputs.run_expensive }}" = "true" ]; then
            test "${{ needs.build-and-test.result }}" = "success"
            test "${{ needs.format-check.result }}" = "success"
          else
            test "${{ needs.build-and-test.result }}" = "skipped"
            test "${{ needs.format-check.result }}" = "skipped"
          fi
