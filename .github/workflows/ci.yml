name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-latest
            preset: linux-clang-debug
          - platform: macOS
            runner: macos-latest
            preset: macos-clang-debug
          - platform: Windows
            runner: windows-2022
            preset: windows-msvc-debug
    runs-on: ${{ matrix.runner }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg

    steps:
      - name: Check out MyCore
        uses: actions/checkout@v6.0.2

      - name: Check out pinned vcpkg
        uses: actions/checkout@v6.0.2
        with:
          repository: microsoft/vcpkg
          ref: ec62869cdd9f80413abb5e4c1d8b68688df932f4
          path: vcpkg

      - name: Bootstrap vcpkg
        if: runner.os != 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        run: ./vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Install Linux dependency tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf autoconf-archive automake libtool libltdl-dev \
            libx11-dev libxft-dev libxext-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libibus-1.0-dev

      - name: Install macOS dependency tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install pkg-config

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package Dots client
        run: cmake --build --preset ${{ matrix.preset }} --target dots_client_package

      - name: Upload Dots client package
        uses: actions/upload-artifact@v7
        with:
          name: dots-client-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/packages/dots-client-*
          if-no-files-found: error
          retention-days: 14

  ci-gate:
    name: CI gate
    needs: build-and-test
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Verify all platform jobs passed
        run: test "${{ needs.build-and-test.result }}" = "success"
