#:schema ./dots-client.schema.json

[window]
title = "Dots"
width = 1280
height = 720
resizable = true
fullscreen = false
high_dpi = true
vsync = true

[network]
mode = "offline"
server_address = "127.0.0.1:27020"
input_redundancy = true

[input]
mode = "hybrid"
mouse_dead_zone_pixels = 12.0

[bindings]
up = ["W", "Up"]
down = ["S", "Down"]
left = ["A", "Left"]
right = ["D", "Right"]
quit = ["Escape"]

[simulation]
max_frame_delta_ms = 250
max_steps_per_frame = 5

[view]
pixels_per_world_unit = 20.0
draw_grid = true
grid_spacing_world_units = 8.0

[debug]
enabled = true
presentation_mode = "comparison"

[colors]
background = "#101820"
grid = "#203040"
player = "#4CC9F0"
player_growth = "#FFD166"
food = "#F72585"
